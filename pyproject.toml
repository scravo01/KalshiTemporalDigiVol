[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "kalshitemporaldigivol"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "aiolimiter>=1.2.1",
    "click>=8.4.0",
    "cryptography>=48.0.0",
    "duckdb>=1.5.2",
    "matplotlib>=3.10.9",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "plotly>=5.24.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.0",
    "streamlit>=1.57.0",
    "tqdm>=4.67.3",
]

[project.scripts]
kvol = "src.cli.main:main"

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "pytest>=9.0.3",
]
